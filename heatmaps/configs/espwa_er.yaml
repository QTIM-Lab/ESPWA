# Attention heatmaps for the ESPWA ER-status model.
#   python create_heatmaps.py --config_file espwa_er.yaml
# Replace the <...> placeholders. Relative paths resolve from the repository root,
# except process_list, which is read from heatmaps/process_lists/.
---
exp_arguments:
  n_classes: 2
  save_exp_code: ESPWA_ER
  raw_save_dir: heatmaps/heatmap_raw_results
  production_save_dir: heatmaps/heatmap_production_results
  batch_size: 256
data_arguments:
  # directory with the whole-slide images
  data_dir: <slide_dir>
  data_dir_key: source
  # csv in heatmaps/process_lists/ with a slide_id column and, optionally, label
  process_list: <process_list.csv>
  preset: presets/bwh_biopsy.csv
  slide_ext: .svs
  label_dict:
    Negative: 0
    Positive: 1
patching_arguments:
  # ESPWA features are 256 px tiles at 20x. On 40x scans read 512 px at level 0 and
  # downsample by 2; on 20x scans use patch_size 256 and custom_downsample 1.
  patch_size: 512
  overlap: 0.0
  patch_level: 0
  custom_downsample: 2
encoder_arguments:
  model_name: conch_v1_5
  target_img_size: 448
model_arguments:
  # any fold's checkpoint from main.py, e.g. results/<exp_code>_s1/s_0_checkpoint.pt
  ckpt_path: <checkpoint.pt>
  model_type: clam_sb
  initiate_fn: initiate_model
  model_size: small
  drop_out: 0.
  embed_dim: 768
heatmap_arguments:
  vis_level: 3
  alpha: 0.4
  blank_canvas: false
  save_orig: false
  save_ext: jpg
  use_ref_scores: true
  blur: false
  use_center_shift: true
  use_roi: false
  calc_heatmap: true
  binarize: false
  binary_thresh: -1
  custom_downsample: 1
  cmap: jet
sample_arguments:
  samples:
    - name: "topk_high_attention"
      sample: true
      seed: 1
      k: 15
      mode: topk
